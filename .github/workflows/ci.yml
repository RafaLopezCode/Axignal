name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: axignal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web/experience
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up production Node major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/web/experience/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/experience/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Frontend regression tests
        run: npm test

      - name: Frontend strict typecheck
        run: npm run typecheck

      - name: Six-language inventory
        run: npm run check:i18n

      - name: Frontend production build
        run: npm run build

      - name: Production Experience container build
        working-directory: ${{ github.workspace }}
        run: docker build --build-arg AXIGNAL_CODE_SHA="${GITHUB_SHA}" --tag axignal-experience:ci --file deploy/production/docker/experience.Dockerfile .

      - name: Admin transport HTTP regressions
        run: npm run test:admin-http

  validate:
    name: Deterministic validation (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11; the declared minimum must actually be tested.
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "${{ matrix.python }}"

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Governance checks (hygiene, terminology, docs, spec, deps, data)
        run: uv run axignal-governance hygiene terminology docs spec deps no-generated-data

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Strict typecheck
        run: uv run mypy

      - name: Full deterministic test suite
        run: uv run pytest

      - name: Architecture Guard
        run: uv run architecture-guard --root .

      - name: Deterministic build
        run: uv build

  graphify-structural:
    name: Graphify structural checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install Graphify
        run: uv tool install graphifyy

      - name: Graphify version
        run: graphify --version

      - name: Structural extraction (offline, no LLM)
        run: graphify update . --no-cluster

      - name: Multigraph collapse diagnosis
        run: graphify diagnose multigraph --json

      - name: Hook presence
        run: |
          graphify hook install
          graphify hook status

      - name: Freshness flag
        run: graphify check-update .

      - name: Governance Graphify gate
        run: uv run axignal-governance graphify

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
