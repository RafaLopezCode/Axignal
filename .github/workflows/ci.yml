name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: axignal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deterministic validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Governance checks (hygiene, terminology, docs, spec, deps, data)
        run: uv run axignal-governance hygiene terminology docs spec deps no-generated-data

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Strict typecheck
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Offline experiment tests
        run: uv run pytest tests/experiments

      - name: Contract tests
        run: uv run pytest tests/contracts

      - name: Architecture tests
        run: uv run pytest tests/architecture

      - name: Architecture Guard
        run: uv run architecture-guard --root .

      - name: Deterministic build
        run: uv build

  graphify-structural:
    name: Graphify structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Graphify
        run: uv tool install graphifyy

      - name: Graphify version
        run: graphify --version

      - name: Structural extraction (offline, no LLM)
        run: graphify update . --no-cluster

      - name: Multigraph collapse diagnosis
        run: graphify diagnose multigraph --json

      - name: Hook presence
        run: |
          graphify hook install
          graphify hook status

      - name: Freshness flag
        run: graphify check-update .

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
