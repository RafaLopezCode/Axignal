worker_processes 1;
pid /tmp/axignal-landing-nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 30;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream axignal_runtime {
    server runtime:18181;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location = /healthz {
      proxy_pass http://axignal_runtime/healthz;
      proxy_set_header Host $host;
    }

    # AO-12/AO-15 expose only these exact public acquisition routes through
    # the landing proxy. Do not widen this to /api/: other runtime write surfaces
    # remain closed unless separately governed and deployed.
    location = /api/weekly-brief/status {
      proxy_pass http://axignal_runtime/api/weekly-brief/status;
      proxy_set_header Host $host;
    }

    location = /api/weekly-brief/requests {
      proxy_pass http://axignal_runtime/api/weekly-brief/requests;
      proxy_set_header Host $host;
    }

    location = /api/acquisition/status {
      proxy_pass http://axignal_runtime/api/acquisition/status;
      proxy_set_header Host $host;
    }

    location = /api/acquisition/events {
      proxy_pass http://axignal_runtime/api/acquisition/events;
      proxy_set_header Host $host;
    }

    location ~* \.(webp|woff2|svg)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location ~* \.(json|html)$ {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
