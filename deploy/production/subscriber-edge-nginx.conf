worker_processes 1;
pid /tmp/axignal-landing-nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 30;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream axignal_runtime {
    server runtime:18181;
    keepalive 8;
  }

  upstream axignal_experience {
    server experience:3810;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location = /healthz {
      proxy_pass http://axignal_runtime/healthz;
      proxy_set_header Host $host;
    }

    # Only subscriber UI/API paths are forwarded to Next.js. Customer Zero and
    # Admin routes remain on their operator-only 127.0.0.1:18182 endpoint.
    location = /account {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /account/ {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /login {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /signup {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Public illustrative demo only. /panorama/live redirects to the real
    # subscriber account; Customer Zero stays behind its operator route.
    location = /panorama {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /panorama/live {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/projection {
      limit_except GET { deny all; }
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/axent {
      limit_except POST { deny all; }
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/start {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/status {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/logout {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/callback/google {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/callback/openai {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /api/subscriber/ {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /_next/ {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Public asset namespaces used by the Panorama demo.
    location ^~ /brand/ {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /observer/ {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /fonts/ {
      proxy_pass http://axignal_experience;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Subscriber Product MCP (ADR-0086): OAuth 2.1 discovery, dynamic client
    # registration, authorize/token and the read-only /mcp resource. Exact
    # paths only; the query string is forwarded for /oauth/authorize.
    location = /mcp {
      client_max_body_size 64k;
      proxy_pass http://axignal_runtime;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
    location = /oauth/register {
      limit_except POST { deny all; }
      client_max_body_size 64k;
      proxy_pass http://axignal_runtime;
      proxy_set_header Host $host;
    }
    location = /oauth/authorize {
      limit_except GET { deny all; }
      proxy_pass http://axignal_runtime;
      proxy_set_header Host $host;
    }
    location = /oauth/token {
      limit_except POST { deny all; }
      client_max_body_size 64k;
      proxy_pass http://axignal_runtime;
      proxy_set_header Host $host;
    }
    location = /.well-known/oauth-authorization-server {
      limit_except GET { deny all; }
      proxy_pass http://axignal_runtime;
      proxy_set_header Host $host;
    }
    location = /.well-known/oauth-protected-resource {
      limit_except GET { deny all; }
      proxy_pass http://axignal_runtime;
      proxy_set_header Host $host;
    }
    location = /.well-known/oauth-protected-resource/mcp {
      limit_except GET { deny all; }
      proxy_pass http://axignal_runtime;
      proxy_set_header Host $host;
    }

    # Preserve the incumbent, exact public runtime routes; do not widen this
    # to /api/ or proxy other write surfaces.
    location = /api/weekly-brief/status {
      proxy_pass http://axignal_runtime/api/weekly-brief/status;
      proxy_set_header Host $host;
    }
    location = /api/weekly-brief/requests {
      proxy_pass http://axignal_runtime/api/weekly-brief/requests;
      proxy_set_header Host $host;
    }
    location = /api/acquisition/status {
      proxy_pass http://axignal_runtime/api/acquisition/status;
      proxy_set_header Host $host;
    }
    location = /api/acquisition/events {
      proxy_pass http://axignal_runtime/api/acquisition/events;
      proxy_set_header Host $host;
    }

    location ~* \.(webp|woff2|svg)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }
    location ~* \.(json|html)$ {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
