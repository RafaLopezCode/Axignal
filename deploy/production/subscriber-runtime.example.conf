# Non-secret subscriber runtime configuration. Copy to the host as
# /etc/axignal/subscriber-runtime.conf and restrict it to root:33, mode 0440.
# Secret values remain in separate files under /run/secrets; never put values here.

AXIGNAL_SUBSCRIBER_ENABLED=true
AXIGNAL_SUBSCRIBER_CONTRACTING_ENABLED=false
AXIGNAL_SUBSCRIBER_PILOT_ENABLED=false

# T11: prices are operator configuration (USD, Standard text tokens, checked 2026-10-08).
# https://developers.openai.com/api/docs/models/gpt-6-luna
# Input ceiling includes the 1.25x cache-write price; audit cost is a conservative
# estimate, not an invoice. No regional processing or Fast mode is requested.
# Existing secret file is mounted separately; never put its value here.
AXIGNAL_AXENT_GROUNDED=false
AXIGNAL_AXENT_LUNA_MODEL=gpt-6-luna
AXIGNAL_AXENT_API_KEY_FILE=/run/secrets/openai_api_key
AXIGNAL_AXENT_INPUT_PER_MILLION=0.125
AXIGNAL_AXENT_OUTPUT_PER_MILLION=0.50
AXIGNAL_AXENT_MAX_CALL_COST=0.003
AXIGNAL_EXPERIENCE_ORIGIN=https://axignal.com

# Google OIDC web client. The client secret is mounted separately by Compose.
# REGISTERED=true is an operator assertion and is valid only after the exact
# HTTPS callback below has been registered at Google.
AXIGNAL_GOOGLE_CLIENT_ID=315323926087-e6pso1nc32gtu5cnavl8eqcsjd80nue3.apps.googleusercontent.com
AXIGNAL_GOOGLE_CLIENT_SECRET_FILE=/run/secrets/google_client_secret
AXIGNAL_GOOGLE_REDIRECT_URI=https://axignal.com/api/auth/callback/google
AXIGNAL_GOOGLE_REGISTERED=true

# Sign in with ChatGPT remains unavailable until separately registered.
AXIGNAL_CHATGPT_REGISTERED=false

# These references and prices are known non-secret commercial identifiers.
# They do not configure checkout or authorize collection. Keep live billing
# absent until API version, credentials, approved fiscal setup, legal identity,
# and external verification are separately complete.
AXIGNAL_STRIPE_ACCOUNT_ID=acct_1TybkH8feyjV8Pem
AXIGNAL_STRIPE_BASE_PRICE_REF=price_1UNYXv8feyjV8PemcFisvBJ2
AXIGNAL_STRIPE_ADDITIONAL_XEED_PRICE_REF=price_1UNYY88feyjV8PemyuI3unra
AXIGNAL_STRIPE_LIVE_ENABLED=false

# Intentionally absent: Stripe API version, API key path, webhook secret path,
# active tax registration proof, legal operator name/tax ID/address/contact/terms.
# Optional T006 identity provider: leave disabled until CTO authorizes activation.
# LEI-holder coverage only; both declarations required. No credentials.
# AXIGNAL_ORGANIZATION_REGISTRY_PROVIDER=gleif
# AXIGNAL_ORGANIZATION_REGISTRY_RIGHTS=https://www.gleif.org/en/meta/lei-data-terms-of-use
