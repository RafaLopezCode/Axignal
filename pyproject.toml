[project]
name = "axignal"
version = "0.0.0"
description = "AXIGNAL governed economic observation runtime and engineering system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AXIGNAL" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  { include-group = "semantic-retrieval" },
]
decision-lab-live = ["typesafe-sdk==0.7.1"]
semantic-retrieval = [
  "numpy>=1.26,<2.3",
  "turboquant",
]
research-canary-live = [
    "openai>=3.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["application", "domain", "pipeline", "cognition", "tools"]

[project.scripts]
architecture-guard = "tools.architecture_guard.guard:main"
axignal-governance = "tools.governance.__main__:main"
axignal-runtime = "tools.runtime.__main__:main"
axignal-runtime-probe = "tools.runtime.probe:main"
axignal-live-research-canary = "tools.runtime.live_research:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".specify", ".opencode", ".codex-uv-cache-*", ".pytest-*", "graphify-out", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["application", "domain", "pipeline", "cognition", "tools"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["application", "domain", "pipeline", "cognition", "tools"]
exclude = ["^\\.specify/", "^\\.opencode/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
turboquant = { git = "https://github.com/Firmamento-Technologies/TurboQuant.git", rev = "2b6596093017419632abb03ae76e19bdcfb9a1e1" }
